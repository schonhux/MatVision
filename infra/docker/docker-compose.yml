# MatVision local dev stack — 6 services, $0/month (see SPEC.md Section 6:
# "local-first infrastructure"). Run from the repo root:
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# Bring up just the infra (no app code) while iterating on api/worker locally:
#   docker compose -f infra/docker/docker-compose.yml up postgres redis minio minio-init

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: matvision
      POSTGRES_PASSWORD: matvision
      POSTGRES_DB: matvision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matvision"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: matvision
      MINIO_ROOT_PASSWORD: matvision123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the matvision bucket so the API doesn't race MinIO's startup
  # on first boot (app/storage.py also calls ensure_bucket(), this is a fast-fail
  # safety net at stack-up time).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 matvision matvision123 &&
      mc mb -p local/matvision || true &&
      exit 0
      "

  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://matvision:matvision@postgres:5432/matvision
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: matvision
      S3_SECRET_KEY: matvision123
      S3_BUCKET: matvision
      JWT_SECRET: dev-only-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://matvision:matvision@postgres:5432/matvision
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: matvision
      S3_SECRET_KEY: matvision123
      S3_BUCKET: matvision
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
